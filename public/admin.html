<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çastidekor — Admin</title>
<style>
  :root{ --ink:#EDE7DA; --ink-dim:#B9B2A2; --bg-0:#171C17; --bg-1:#1E2419; --brass:#B99457; --line:rgba(237,231,218,0.14); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg-0); color:var(--ink); font-family:'Work Sans', Arial, sans-serif; padding:40px 24px; }
  .wrap{ max-width:1000px; margin:0 auto; }
  h1{ font-size:24px; margin-bottom:6px; }
  p.sub{ color:var(--ink-dim); margin-bottom:28px; font-size:14px; }
  #login{ max-width:340px; display:flex; flex-direction:column; gap:12px; }
  input{ background:var(--bg-1); border:1px solid var(--line); color:var(--ink); padding:12px 14px; border-radius:2px; font-size:14px; }
  button{ background:var(--brass); color:#171C17; border:none; padding:12px 18px; border-radius:2px; font-weight:600; cursor:pointer; }
  button:hover{ opacity:0.9; }
  table{ width:100%; border-collapse:collapse; margin-top:20px; font-size:13.5px; }
  th, td{ text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ color:var(--brass); text-transform:uppercase; font-size:11.5px; letter-spacing:0.05em; }
  tr:hover td{ background:rgba(185,148,87,0.05); }
  .del{ background:none; border:1px solid var(--line); color:var(--ink-dim); padding:6px 10px; font-size:12px; }
  .del:hover{ border-color:#c0605a; color:#c0605a; }
  .empty{ color:var(--ink-dim); padding:30px 0; }
  .top-row{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  #err{ color:#c0605a; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Çastidekor — Panel Admin</h1>
  <p class="sub">Të gjitha kërkesat e ardhura nga forma e kontaktit.</p>

  <div id="login">
    <input id="pwd" type="password" placeholder="Fjalëkalimi i adminit">
    <button onclick="tryLogin()">Hyr</button>
    <p id="err"></p>
  </div>

  <div id="panel" style="display:none;">
    <div class="top-row">
      <span id="count" class="sub"></span>
      <button onclick="loadContacts()">Rifresko</button>
    </div>
    <table id="table" style="display:none;">
      <thead>
        <tr><th>Data</th><th>Emri</th><th>Telefoni</th><th>Lloji</th><th>Data e Eventit</th><th>Mesazhi</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="emptyMsg" style="display:none;">Ende nuk ka kërkesa.</p>
  </div>
</div>

<script>
  let password = '';

  async function tryLogin(){
    const pwdInput = document.getElementById('pwd');
    password = pwdInput.value;
    const res = await fetch('/api/admin/contacts', { headers: { 'x-admin-password': password } });
    if(res.status === 401){
      document.getElementById('err').textContent = 'Fjalëkalim i gabuar.';
      return;
    }
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    render(await res.json());
  }

  async function loadContacts(){
    const res = await fetch('/api/admin/contacts', { headers: { 'x-admin-password': password } });
    render(await res.json());
  }

  async function deleteRow(id){
    if(!confirm('Fshi këtë kërkesë?')) return;
    await fetch('/api/admin/contacts/' + id, { method: 'DELETE', headers: { 'x-admin-password': password } });
    loadContacts();
  }

  function render(data){
    const rows = document.getElementById('rows');
    const table = document.getElementById('table');
    const emptyMsg = document.getElementById('emptyMsg');
    const count = document.getElementById('count');
    rows.innerHTML = '';
    const contacts = data.contacts || [];
    count.textContent = contacts.length + ' kërkesa gjithsej';

    if(contacts.length === 0){
      table.style.display = 'none';
      emptyMsg.style.display = 'block';
      return;
    }
    table.style.display = 'table';
    emptyMsg.style.display = 'none';

    contacts.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${new Date(c.created_at).toLocaleString()}</td>
        <td>${escapeHtml(c.name)}</td>
        <td>${escapeHtml(c.phone || '—')}</td>
        <td>${escapeHtml(c.event_type || '—')}</td>
        <td>${escapeHtml(c.event_date || '—')}</td>
        <td>${escapeHtml(c.message || '—')}</td>
        <td><button class="del" onclick="deleteRow(${c.id})">Fshi</button></td>
      `;
      rows.appendChild(tr);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('pwd').addEventListener('keydown', e => {
    if(e.key === 'Enter') tryLogin();
  });
</script>
</body>
</html>
